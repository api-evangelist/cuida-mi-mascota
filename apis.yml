aid: cuida-mi-mascota
name: Cuida Mi Mascota
description: >-
  Cuida Mi Mascota (CuidaMiMascota SAPI de CV) is a Mexican pet-care marketplace
  that connects pet owners with vetted, trusted caregivers for boarding
  (hospedaje), daycare, in-home visits, and dog walking across cities in Mexico.
  Delivered primarily as consumer iOS and Android mobile apps, the platform has
  served more than 250,000 pet owners and lets caregivers register to offer
  services. It is a 500 Global portfolio company. The company exposes no public
  API, developer portal, or SDK today; this profile is maintained in the API
  Evangelist network as a company lead with identity and domain-security signals
  captured for discovery.
